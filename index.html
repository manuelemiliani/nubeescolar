<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NubeEscolar | Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Canvas dinámico de fondo */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

  <!-- Fondo de partículas animadas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Tarjeta Principal de Login -->
  <main class="relative z-10 w-full max-w-md p-6 sm:p-8 m-4 bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/60 shadow-2xl">
    
    <!-- Logo Centrado Arriba -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 mb-3 shadow-lg shadow-indigo-500/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 001-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />
        </svg>
      </div>
      <h1 class="text-3xl font-black tracking-tight text-white">Nube<span class="text-indigo-400">Escolar</span></h1>
      <p class="text-slate-400 text-sm mt-1">Plataforma de Gestión Académica</p>
    </div>

    <!-- Formulario -->
    <form class="space-y-5" onsubmit="event.preventDefault(); alert('Iniciando sesión...');">
      
      <!-- Selección de Colegio -->
      <div>
        <label for="colegio" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Seleccionar Colegio</label>
        <div class="relative">
          <select id="colegio" required class="w-full px-4 py-3 bg-slate-900/90 border border-slate-600 rounded-xl text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 appearance-none transition-colors">
            <option value="" disabled selected>-- Selecciona tu institución --</option>
            <option value="mount">Colegio Educativo Mount</option>
            <option value="educenter">Colegio Educenter</option>
            <option value="san_andres">I.E.D. Rural San Andrés</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Usuario -->
      <div>
        <label for="usuario" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Usuario</label>
        <input type="text" id="usuario" required placeholder="Ingresa tu usuario o documento" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
      </div>

      <!-- Clave -->
      <div>
        <label for="clave" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
        <input type="password" id="clave" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
      </div>

      <!-- Botón de Ingreso -->
      <button type="submit" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-500/50 transition-all duration-200 mt-2">
        Ingresar al Sistema
      </button>

    </form>

    <footer class="mt-6 text-center text-xs text-slate-500">
      © 2026 NubeEscolar. Todos los derechos reservados.
    </footer>
  </main>

  <!-- Script para el fondo dinámico interactivo -->
  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2 + 1,
      dx: (Math.random() - 0.5) * 0.6,
      dy: (Math.random() - 0.5) * 0.6,
      alpha: Math.random() * 0.5 + 0.2
    }));

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Fondo sutil con degradado
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#0f172a');
      gradient.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(129, 140, 248, ${p.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#6366f1';
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
